name: build-ydxz-dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'YDXZTweak.m'
      - 'ydxz_inject.js'
      - 'avatar.b64'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 生成 JS / 头像 字符串字面量（逐字节自校验）
        run: |
          mkdir -p build
          python3 - <<'PY'
          import re, sys

          def c_escape(s):
              out = []
              for ch in s:
                  if ch == '\\': out.append('\\\\')
                  elif ch == '"': out.append('\\"')
                  elif ch == '\n': out.append('\\n')
                  elif ch == '\r': out.append('\\r')
                  elif ch == '\t': out.append('\\t')
                  elif ord(ch) < 0x20: out.append('\\%03o' % ord(ch))
                  else: out.append(ch)
              return ''.join(out)

          def unesc(s):
              r = []; i = 0
              while i < len(s):
                  if s[i] == '\\':
                      c = s[i+1]
                      if c == 'n': r.append('\n'); i += 2
                      elif c == 'r': r.append('\r'); i += 2
                      elif c == 't': r.append('\t'); i += 2
                      elif c == '\\': r.append('\\'); i += 2
                      elif c == '"': r.append('"'); i += 2
                      elif c.isdigit(): r.append(chr(int(s[i+1:i+4], 8))); i += 4
                      else: r.append(c); i += 2
                  else:
                      r.append(s[i]); i += 1
              return ''.join(r)

          def emit(src_path, out_path, var, fn, chunk=1600):
              data = open(src_path, encoding='utf-8').read()
              # ⚠️ 必须先按原文分块，再逐块转义；反序会劈开 \\ 或 \" 导致字符串提前闭合
              chunks = [data[i:i+chunk] for i in range(0, len(data), chunk)]
              body = '/* generated by CI: do not edit */\nstatic const char *%s =\n' % var
              body += ''.join('    "%s"\n' % c_escape(c) for c in chunks)
              body += ';\nconst char *%s(void) { return %s; }\n' % (fn, var)
              open(out_path, 'w').write(body)
              lits = re.findall(r'"((?:[^"\\]|\\.)*)"', body)
              rec = ''.join(unesc(x) for x in lits)
              print('SELFCHECK', src_path, 'CLEAN' if rec == data else 'FAIL', len(data))
              return rec == data

          ok1 = emit('ydxz_inject.js', 'build/ydxz_js.c', 'kYdxzJs', 'ydxz_inject_js')
          ok2 = emit('avatar.b64', 'build/ydxz_av.c', 'kYdxzAvatar', 'ydxz_avatar_b64', 1500)
          sys.exit(0 if (ok1 and ok2) else 1)
          PY

      - name: 编译 dylib（arm64，无 Theos / 无 substrate）
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          CF="-arch arm64 -miphoneos-version-min=15.0 -isysroot $SDK -O2 -fobjc-arc -Wall -Wno-unused-variable"
          xcrun -sdk iphoneos clang $CF -c -o /tmp/ydxz_js.o   build/ydxz_js.c
          xcrun -sdk iphoneos clang $CF -c -o /tmp/ydxz_av.o   build/ydxz_av.c
          xcrun -sdk iphoneos clang $CF -c -o /tmp/ydxz_main.o YDXZTweak.m
          xcrun -sdk iphoneos clang $CF -c -o /tmp/fishhook.o  fishhook.c
          xcrun -sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 -isysroot $SDK \
            -dynamiclib -fobjc-arc -O2 \
            -install_name @executable_path/YDXZTweak.dylib \
            -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics \
            -framework JavaScriptCore \
            -o YDXZTweak.dylib /tmp/ydxz_main.o /tmp/ydxz_js.o /tmp/ydxz_av.o /tmp/fishhook.o

      - name: 校验产物
        run: |
          file YDXZTweak.dylib
          vtool -show-build YDXZTweak.dylib || true
          echo "--- 未定义符号（不应出现 CydiaSubstrate） ---"
          xcrun -sdk iphoneos nm -u YDXZTweak.dylib | grep -i substrate || echo "OK: 无 substrate 依赖"
          xcrun -sdk iphoneos nm -u YDXZTweak.dylib | head -40
          ls -la YDXZTweak.dylib
          md5 YDXZTweak.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: YDXZTweak.dylib
          path: |
            YDXZTweak.dylib
            YDXZTweak.m
            ydxz_inject.js
            control
